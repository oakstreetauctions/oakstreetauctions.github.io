name: Build local NCAA logo library

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/ncaa/espn_ids.json"
      - "scripts/build_ncaa_assets.py"
      - ".github/workflows/build-ncaa-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all team logos and generate manifest
        run: python scripts/build_ncaa_assets.py
      - name: Commit local logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ncaa
          git diff --cached --quiet || git commit -m "Add locally hosted NCAA men's basketball logos"
          git push
